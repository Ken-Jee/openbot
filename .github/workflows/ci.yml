name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # No job here builds the native mobile app, so the postinstall skips the React Native Skia
  # library copy. The jobs that install with `--ignore-scripts` skip it already.
  OPENBOT_SKIP_SKIA: "1"

jobs:
  detect:
    # A pull request runs each lane only when a path the lane reads changed. A path every
    # workspace reads - the lockfile, a shared package, a workflow - runs all of them. A push to
    # main and a manual run always run every lane: `deploy-production` needs them, and a skipped
    # need would skip the deploy.
    #
    # `code` runs for every change except Markdown that no build or test reads: lint and knip cover
    # every workspace. `docs` runs for any Markdown change, so that `Check` still checks its links. `desktop` lists what it skips, not what it reads: the other apps, which the
    # Electron build does not read. `api` also reads the renderer: the Worker bundles its preview
    # and web client.
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.lanes.outputs.code }}
      docs: ${{ steps.lanes.outputs.docs }}
      desktop: ${{ steps.lanes.outputs.desktop }}
      api: ${{ steps.lanes.outputs.api }}
      remote: ${{ steps.lanes.outputs.remote }}
      storybook: ${{ steps.lanes.outputs.storybook }}
      surfaces: ${{ steps.lanes.outputs.surfaces }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit. Its first parent is the base branch, so the
          # two commits hold exactly the changes the pull request brings.
          fetch-depth: 2

      - name: Select lanes
        id: lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            changed="package.json"
          else
            # Without `--no-renames`, a moved file lists only its new path, and a move to `docs/`
            # would hide the path that a lane reads.
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          fi
          # Markdown that no build or test reads changes no lane. Not every Markdown file: the API
          # bundles CHANGELOG.md, and the renderer bundles Markdown from `resources/`.
          docs='^((docs|plans|changelog\.d)/.+\.md|(.+/)?AGENTS\.md|(ANALYTICS|CODE_OF_CONDUCT|CONTRIBUTING|PRIVACY|README|SECURITY|SUPPORT)\.md)$'
          all="$changed"
          changed="$(grep -Ev "$docs" <<<"$changed" || true)"
          shared='^(package\.json|bun\.lock|bunfig\.toml|\.nvmrc|biome\.json|tsconfig[^/]*\.json|\.github/|packages/|patches/|tools/|vendor/)'
          lane() {
            if grep -Eq "$shared|$2" <<<"$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          # The inverse, for a lane that reads most of the repository: it runs when a changed path
          # does not match the pattern.
          lane_unless() {
            if grep -Ev "$2" <<<"$changed" | grep -q .; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          lane code '.'
          # Every Markdown file, before the filter above removed some of them.
          if grep -Eq "\.md$|^scripts/check-doc-links\.ts$" <<<"$all" || grep -Eq "$shared" <<<"$changed"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi
          lane_unless desktop '^(apps/(auth-api|mobile|site-router|status)|docker|remote)/'
          lane api '^(apps/(auth-api|site-router)|src/renderer|resources)/|^(apps/mobile/)?CHANGELOG\.md$'
          lane remote '^(remote|scripts)/'
          lane storybook '^(src|apps/(auth-api|status)|\.storybook|resources|marketplace|build)/'
          lane surfaces '^(apps/(mobile|site-router|status)|remote|scripts)/'
          cat "$GITHUB_OUTPUT"

  check:
    # `check:desktop` is this job and `browser` together, in that order. The
    # browser smoke test starts the real Electron binary under xvfb on another
    # Ubuntu runner, so the two run side by side. The install here is the full
    # one: this job builds with electron-vite, which resolves the `electron`
    # package.
    #
    # Branch protection requires this job, and a skipped required check counts as passed. So it
    # runs when `detect` did not succeed, and it skips only when `detect` found no code change and
    # no Markdown change. A Markdown-only change runs only the link check.
    name: Check
    needs: detect
    if: ${{ !cancelled() && (needs.detect.result != 'success' || needs.detect.outputs.code == 'true' || needs.detect.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODE: ${{ needs.detect.result != 'success' || needs.detect.outputs.code == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Check unused files and dependencies
        if: env.CODE == 'true'
        run: bun run knip:check

      - name: Check image asset directories
        if: env.CODE == 'true'
        run: bun run check:assets

      - name: Check Markdown links and anchors
        run: bun run check:doc-links

      - name: Check desktop application
        if: env.CODE == 'true'
        run: bun run check:desktop:static

      - parallel:
          - name: Check translation catalogs
            if: env.CODE == 'true'
            run: bun run i18n:check

          - name: Check ratcheted TypeScript options
            if: env.CODE == 'true'
            run: bun run types:ratchet

  browser:
    # The smoke test starts the real Electron binary and opens windows, so it
    # needs a display. Ubuntu runners have none, so it runs under xvfb, where
    # the queue is shorter and the boot faster than a macOS runner. The install
    # is the default full one: it downloads the Electron binary the test
    # starts, which `development-checks.md` measures as faster than restoring
    # a binary cache.
    name: Browser smoke
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - parallel:
          - name: Set up Bun
            uses: ./.github/actions/setup-bun

          - name: Install a virtual display
            shell: bash
            run: |
              sudo apt-get update
              sudo apt-get install --no-install-recommends --yes xvfb

      - name: Run the browser smoke test
        run: xvfb-run -a bun run test:browser

  tests-desktop:
    # ubuntu-latest gives 4 vCPUs, so vitest runs 3 workers and the job is
    # CPU-bound. The suite is split across shards that run as their own
    # runners. The split is by recorded duration rather than vitest's own file-size one - see
    # tools/vitest/balanced-sequencer.ts for why, and run `bun run
    # test:durations` when the two shards below stop finishing together.
    name: Tests (desktop ${{ matrix.shard }}/2)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run desktop tests
        run: bun run test:desktop -- --shard=${{ matrix.shard }}/2

  signal-e2e:
    # Starts the real Signal service with throwaway secrets and checks its secret and
    # authentication rules over HTTP and WebSocket. It needs no external service.
    name: Signal E2E
    needs: detect
    if: needs.detect.outputs.remote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Signal E2E test
        run: bun run test:signal

      - name: Upload the Signal E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signal-security-e2e
          path: .openbot-build/signal-security-e2e/
          if-no-files-found: ignore

  automation-cli-e2e:
    # Runs `openbot-cli` with Node against the real Local scripts server on a loopback port, with
    # an in-memory agent service. It needs no Electron, display or external service.
    name: Local scripts CLI E2E
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Local scripts CLI E2E test
        run: bun run test:automation-cli

      - name: Upload the Local scripts CLI E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automation-cli-e2e
          path: .openbot-build/automation-cli-e2e/
          if-no-files-found: ignore

  team-api-routes-e2e:
    # Drives the real Team API server over HTTP on a loopback port, with the real team store and
    # direct-message store on temporary files and an in-memory agent service. It needs no Electron,
    # display or external service.
    name: Team API routes E2E
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Team API routes E2E test
        run: bun run test:team-api-routes

      - name: Upload the Team API routes E2E report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: team-api-routes-e2e
          path: .openbot-build/team-api-routes-e2e/
          if-no-files-found: ignore

  reverse-actions-e2e:
    # Runs the released Team API adapters and the reverse actions (revoke and reconnect, mute and
    # unmute, pause and resume, hide and restore) against the real host services on a temporary
    # profile, with loopback HTTP and WebSocket. It also starts the host stores on settings files that
    # a power loss filled with zeros. It needs no Electron, display or external service.
    name: Team API and reverse actions E2E
    needs: detect
    if: needs.detect.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Run the Team API legacy clients E2E test
        if: ${{ !cancelled() }}
        run: bun run test:team-legacy-clients

      - name: Run the Team session revoke and reconnect E2E test
        if: ${{ !cancelled() }}
        run: bun run test:team-session-revoke

      - name: Run the server mute and unmute E2E test
        if: ${{ !cancelled() }}
        run: bun run test:server-mute

      - name: Run the routine pause and resume E2E test
        if: ${{ !cancelled() }}
        run: bun run test:routine-pause-resume

      - name: Run the agent hide and restore E2E test
        if: ${{ !cancelled() }}
        run: bun run test:agent-hide-restore

      - name: Run the messaging pause and resume E2E test
        if: ${{ !cancelled() }}
        run: bun run test:messaging-pause-resume

      - name: Run the Discord role list and reply context E2E test
        if: ${{ !cancelled() }}
        run: bun run test:messaging-discord-access

      - name: Run the zero-filled settings file E2E test
        if: ${{ !cancelled() }}
        run: bun run test:zero-filled-settings

      - name: Run the provider update during a turn E2E test
        if: ${{ !cancelled() }}
        run: bun run test:provider-update-busy

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reverse-actions-e2e
          path: |
            .openbot-build/team-api-legacy-clients-e2e/
            .openbot-build/team-session-revoke-e2e/
            .openbot-build/server-mute-e2e/
            .openbot-build/routine-pause-resume-e2e/
            .openbot-build/agent-hide-restore-e2e/
            .openbot-build/messaging-pause-resume-e2e/
            .openbot-build/messaging-discord-access-e2e/
            .openbot-build/zero-filled-settings-e2e/
            .openbot-build/provider-update-busy-e2e/
          if-no-files-found: ignore

  surfaces:
    # `desktop:typecheck` covers only the desktop projects, so without this job
    # `apps/mobile`, `apps/site-router`, `packages/team-client`, `remote/api`,
    # `packages/logging`, `packages/user-errors` and `packages/i18n`
    # first break at release time rather than on the pull request that broke
    # them. Mobile's typecheck generates `expo-env.d.ts` and the uniwind
    # declarations first - both are gitignored, so a fresh checkout cannot
    # resolve `global.css`. `remote/api` is typechecked through the workspace's
    # own script; its `include` reaches `../scripts/*.ts`, so the stack scripts
    # come with it. `remote:check:compose` is the rest of
    # `remote:check`: `docker compose config` interpolates client-side and never
    # opens a socket, so it validates both Compose files on a runner with no
    # daemon.
    name: Surfaces
    needs: detect
    if: needs.detect.outputs.surfaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - parallel:
          - name: Typecheck mobile
            run: bun run mobile:typecheck

          - name: Typecheck team client
            run: bun run typecheck:team-client

      - parallel:
          - name: Typecheck site router
            run: bun run typecheck:sites

          - name: Typecheck remote API
            run: bun run typecheck:remote

          - name: Typecheck status page
            run: bun run typecheck:status

      - parallel:
          - name: Typecheck logging
            run: bun run typecheck:logging

          - name: Typecheck telemetry
            run: bun run typecheck:telemetry

          - name: Typecheck user errors
            run: bun run typecheck:user-errors

          - name: Typecheck i18n
            run: bun run typecheck:i18n

      - name: Validate the remote Compose files
        run: bun run remote:check:compose

  api:
    # `check:api` ends with `api:build:check`, the preview build of the Worker. For a pull request
    # from this repository, this job uploads that build. It has no secrets and no write token. The
    # trusted `cloudflare-preview.yml` workflow uploads the build and comments on the pull request
    # after this run completes; it runs code from `main` only. Forks get no preview. A pull request
    # that skips this lane, or fails it, keeps the preview of its last commit that built one.
    name: API
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Check API
        run: bun run check:api

      - name: Upload preview build
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloudflare-preview
          path: apps/auth-api/dist
          # The build writes `.assetsignore`, which keeps the config out of the public assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  storybook:
    name: Storybook build
    needs: detect
    if: needs.detect.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      - name: Build Storybook
        run: bun run build-storybook
        env:
          # This output is not published. Skip Solid's per-component docgen analysis.
          OPENBOT_STORYBOOK_CHECK: "true"

  all-checks-pass:
    # A summary of every job. Branch protection requires `Check`, not this job. A lane that
    # `detect` skipped counts as passed; a failed or cancelled job, including `detect` itself,
    # fails this one.
    name: All required checks pass
    if: always()
    needs: [detect, check, browser, tests-desktop, signal-e2e, automation-cli-e2e, team-api-routes-e2e, reverse-actions-e2e, surfaces, api, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on a failed or cancelled job
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A required job ended as $result." >&2
                exit 1
                ;;
            esac
          done

  deploy-production:
    name: Deploy Cloudflare production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `surfaces` gates the deploy even though the Worker it ships lives in
    # `apps/auth-api`, which `api` already covers: mobile, the site router, the
    # team client and the remote stack all consume the account API, so a red
    # Surfaces is the signal that this deploy is the thing about to break them.
    needs: [check, browser, tests-desktop, signal-e2e, automation-cli-e2e, team-api-routes-e2e, reverse-actions-e2e, api, storybook, surfaces]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    # Template selection changes Worker settings. Do not race a Worker deployment.
    concurrency:
      group: cloudflare-production-worker
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Build production Worker
        run: bun run api:build

      - name: Prepare runtime secrets
        id: runtime-secrets
        shell: bash
        env:
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          SKILLS_ADMIN_TOKEN: ${{ secrets.SKILLS_ADMIN_TOKEN }}
          SITE_OPERATIONS_ADMIN_TOKEN: ${{ secrets.SITE_OPERATIONS_ADMIN_TOKEN }}
          SERVER_CLAIMS_ADMIN_TOKEN: ${{ secrets.SERVER_CLAIMS_ADMIN_TOKEN }}
          SITE_REPORT_HASH_SECRET: ${{ secrets.SITE_REPORT_HASH_SECRET }}
          REMOTE_TICKET_PRIVATE_JWK: ${{ secrets.REMOTE_TICKET_PRIVATE_JWK }}
          REMOTE_TICKET_PUBLIC_JWKS: ${{ secrets.REMOTE_TICKET_PUBLIC_JWKS }}
          REMOTE_AUTH_WEBHOOK_SECRET: ${{ secrets.REMOTE_AUTH_WEBHOOK_SECRET }}
          OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID }}
          OPENPANEL_CLIENT_SECRET: ${{ secrets.OPENPANEL_CLIENT_SECRET }}
          # Optional: an unset value keeps the value that the Worker has. See docs/hosted-servers.md.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          BOAT_WEBHOOK_SECRET: ${{ secrets.BOAT_WEBHOOK_SECRET }}
          # GitHub refuses an Actions secret name that starts with GITHUB_. The Worker name is GITHUB_APP_PRIVATE_KEY.
          OPENBOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.OPENBOT_GITHUB_APP_PRIVATE_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          secrets_path="$RUNNER_TEMP/openbot-worker-secrets.json"
          umask 077
          SECRETS_PATH="$secrets_path" bun -e '
            const smtp = process.env.EMAIL_SMTP_PASSWORD;
            const skillsAdmin = process.env.SKILLS_ADMIN_TOKEN;
            const siteOperationsAdmin = process.env.SITE_OPERATIONS_ADMIN_TOKEN;
            const serverClaimsAdmin = process.env.SERVER_CLAIMS_ADMIN_TOKEN;
            const siteReportHash = process.env.SITE_REPORT_HASH_SECRET;
            const remotePrivateJwk = process.env.REMOTE_TICKET_PRIVATE_JWK;
            const remotePublicJwks = process.env.REMOTE_TICKET_PUBLIC_JWKS;
            const remoteWebhookSecret = process.env.REMOTE_AUTH_WEBHOOK_SECRET;
            const openpanelClientId = process.env.OPENPANEL_CLIENT_ID?.trim();
            const openpanelClientSecret = process.env.OPENPANEL_CLIENT_SECRET?.trim();
            if (!openpanelClientId || !openpanelClientSecret) {
              throw new Error("OPENPANEL_CLIENT_ID and OPENPANEL_CLIENT_SECRET are required for production analytics.");
            }
            const path = process.env.SECRETS_PATH;
            if (
              !smtp ||
              !skillsAdmin ||
              !siteReportHash ||
              !remotePrivateJwk ||
              !remotePublicJwks ||
              !remoteWebhookSecret ||
              !path
            ) {
              throw new Error("Required production secrets are missing.");
            }
            // A Stripe or boat key without its webhook secret takes payments or makes sandboxes that
            // the Worker never sees, so each pair is set together or not at all.
            const optional = {};
            for (const names of [
              ["STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET"],
              ["BOAT_API_KEY", "BOAT_WEBHOOK_SECRET"],
              // The Live Activity relay stays off until both are set.
              ["APNS_PRIVATE_KEY", "APNS_KEY_ID"],
            ]) {
              const present = names.filter((name) => process.env[name]?.trim());
              if (present.length === 0) continue;
              if (present.length !== names.length) throw new Error(`Set ${names.join(" and ")} together.`);
              for (const name of names) optional[name] = process.env[name].trim();
            }
            const githubAppKey = process.env.OPENBOT_GITHUB_APP_PRIVATE_KEY?.trim();
            if (githubAppKey) optional.GITHUB_APP_PRIVATE_KEY = githubAppKey;
            // The Android notification relay stays off until the Firebase service account key is set.
            const fcmServiceAccount = process.env.FCM_SERVICE_ACCOUNT?.trim();
            if (fcmServiceAccount) {
              let parsed;
              try {
                parsed = JSON.parse(fcmServiceAccount);
              } catch {
                parsed = null;
              }
              if (parsed?.type !== "service_account") throw new Error("FCM_SERVICE_ACCOUNT is not a Firebase service account key file.");
              optional.FCM_SERVICE_ACCOUNT = fcmServiceAccount;
            }
            const stripeKey = optional.STRIPE_SECRET_KEY;
            if (stripeKey && !stripeKey.startsWith("sk_live_") && !stripeKey.startsWith("rk_live_")) {
              throw new Error("STRIPE_SECRET_KEY is not a live key.");
            }
            const secrets = {
              ...optional,
              OPENPANEL_CLIENT_ID: openpanelClientId,
              OPENPANEL_CLIENT_SECRET: openpanelClientSecret,
              EMAIL_SMTP_PASSWORD: smtp,
              SKILLS_ADMIN_TOKEN: skillsAdmin,
              SITE_REPORT_HASH_SECRET: siteReportHash,
              ...(siteOperationsAdmin ? { SITE_OPERATIONS_ADMIN_TOKEN: siteOperationsAdmin } : {}),
              ...(serverClaimsAdmin ? { SERVER_CLAIMS_ADMIN_TOKEN: serverClaimsAdmin } : {}),
              REMOTE_TICKET_PRIVATE_JWK: remotePrivateJwk,
              REMOTE_TICKET_PUBLIC_JWKS: remotePublicJwks,
              REMOTE_AUTH_WEBHOOK_SECRET: remoteWebhookSecret,
            };
            await Bun.write(path, JSON.stringify(secrets));
          '
          echo "path=$secrets_path" >> "$GITHUB_OUTPUT"

      - name: Apply production D1 migrations
        working-directory: apps/auth-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy public site router
        working-directory: apps/site-router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_ROUTER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.jsonc --keep-vars

      - name: Deploy production Worker
        working-directory: apps/auth-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PRODUCTION_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: ../../node_modules/.bin/wrangler deploy --config dist/server/wrangler.json --keep-vars --secrets-file "${{ steps.runtime-secrets.outputs.path }}"

      - name: Remove temporary runtime secrets
        if: always() && steps.runtime-secrets.outputs.path != ''
        run: rm -f "${{ steps.runtime-secrets.outputs.path }}"

      - name: Verify production deployment
        shell: bash
        env:
          SITE_HOSTING_EXPECTED_ENABLED: ${{ vars.SITE_HOSTING_EXPECTED_ENABLED }}
        # Each check names the URL and the value that it received when it fails. A bare `test` or
        # `grep -q` stops the step with no message, and the logs of earlier failures could not show
        # which check failed. The received headers include `cf-cache-status` and `age`, which show
        # whether the edge served a cached response of the previous Worker version.
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          fail() {
            echo "::error title=Verify production deployment::$1"
            exit 1
          }
          require_status() {
            test "$1" = "$2" || fail "$3 returned HTTP $1. Expected HTTP $2."
          }
          require_header() {
            if ! tr -d '\r' < "$1" | grep -Eiq "$2"; then
              echo "Response headers of $3:"
              tr -d '\r' < "$1"
              fail "$3 has no response header that matches '$2'."
            fi
          }
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://openbot.run/ >/dev/null
          join_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/join.headers" \
            --output "$verification_dir/join.html" --write-out '%{http_code}' \
            https://openbot.run/join)"
          require_status "$join_status" 200 https://openbot.run/join
          require_header "$verification_dir/join.headers" '^cache-control:.*no-store' https://openbot.run/join
          require_header "$verification_dir/join.headers" '^referrer-policy:.*no-referrer' https://openbot.run/join
          association_url=https://openbot.run/.well-known/apple-app-site-association
          association_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/association.headers" \
            --output "$verification_dir/association.json" --write-out '%{http_code}' \
            "$association_url")"
          require_status "$association_status" 200 "$association_url"
          require_header "$verification_dir/association.headers" '^content-type: application/json' "$association_url"
          if ! jq -e '.applinks.details == [{"appID":"ZTRDTUL87R.app.openbot.desktop","paths":["/join"]},{"appID":"ZTRDTUL87R.run.openbot.mobile","paths":["/join","/agents/*"]}]' \
            "$verification_dir/association.json" >/dev/null; then
            echo "Response headers of $association_url:"
            tr -d '\r' < "$verification_dir/association.headers"
            echo "Response body of $association_url (first 4000 bytes):"
            head -c 4000 "$verification_dir/association.json"
            echo
            fail "$association_url does not have the expected applinks.details."
          fi
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://api.openbot.run/health/live >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://api.openbot.run/health/ready >/dev/null
          site_url=https://deployment-smoke-check.openbot.site/
          site_status="$(curl --silent --show-error --retry 5 --retry-all-errors \
            --max-redirs 0 --dump-header "$verification_dir/site-router.headers" \
            --output "$verification_dir/site-router.txt" --write-out '%{http_code}' \
            "$site_url")"
          case "$SITE_HOSTING_EXPECTED_ENABLED" in
            true) require_status "$site_status" 404 "$site_url" ;;
            false) require_status "$site_status" 503 "$site_url" ;;
            *) fail "SITE_HOSTING_EXPECTED_ENABLED must be true or false." ;;
          esac
          require_header "$verification_dir/site-router.headers" '^cache-control:.*no-store' "$site_url"
          require_header "$verification_dir/site-router.headers" '^x-content-type-options:.*nosniff' "$site_url"
          require_header "$verification_dir/site-router.headers" '^x-robots-tag:.*noindex' "$site_url"
